# Effort: reasoning_effort = none|low|medium|high; minimal, xhigh and max are refused with 400.
# Video is refused with 400 unsupported_input.
# https://graphn.ai/inference/kimi-k2.5
# Live 2026-10-27: PNG, JPEG, GIF and WebP images are read; json_schema honoured. Unset,
# none, low and medium returned no reasoning on a short arithmetic prompt; high returned
# 1,061-1,453 characters in reasoning_content. thinking.type = enabled,
# chat_template_kwargs.thinking / enable_thinking and reasoning.enabled are accepted but
# return no reasoning. No cached tokens reported on a repeated ~10K-token prefix. There is no
# separate output cap: max_tokens = 256,000 is accepted and 262,144 is refused with 400
# context_length_exceeded.
schema = 2
base_model = "moonshotai/kimi-k2.5"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
reasoning = { supported = true, default = { type = "effort", value = "none" }, effort = ["none", "low", "medium", "high"] }
structured_output = true

[limit]
context = 256_000
output = 256_000

[api.chat-completions]
compatibility = { reasoning_field = "reasoning_content" }

[cost.text.input]
price = 0.6

[cost.text.output]
price = 3
